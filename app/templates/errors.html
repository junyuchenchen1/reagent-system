{% extends 'base.html' %}
{% block title %}{{ code }}{% endblock %}
{% block full %}
<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;background:var(--bg-body);">
    <h1 style="font-size:96px;font-weight:700;color:var(--primary);margin:0;">{{ code }}</h1>
    <p class="text-muted fs-5 mt-2">{{ message }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-3"><i class="bi bi-house"></i> 返回首页</a>
</div>
{% endblock %}
