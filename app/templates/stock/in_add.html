{% extends 'base.html' %}
{% block title %}试剂入库{% endblock %}
{% block page_title %}试剂入库{% endblock %}

{% block content %}
<div class="row">
    <!-- 左：扫码 + 扫码结果 -->
    <div class="col-lg-4 mb-3">
        <div class="card" style="border:2px solid var(--primary);">
            <div class="card-body">
                <h5 class="mb-2"><i class="bi bi-upc-scan text-primary"></i> 扫试剂盒 UDI 码</h5>
                <div class="input-group input-group-lg">
                    <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
                    <input type="text" class="form-control" id="udiInput" autocomplete="off" autofocus
                           placeholder="扫描 / 输入 DM 码">
                </div>
                <div class="d-flex gap-2 mt-2">
                    <button type="button" class="btn btn-outline-primary btn-sm flex-fill" id="udiCamBtn">
                        <i class="bi bi-camera"></i> 摄像头扫码
                    </button>
                    <button type="button" class="btn btn-outline-secondary btn-sm flex-fill" id="udiPhotoBtn">
                        <i class="bi bi-image"></i> 拍照识别
                    </button>
                </div>
                <input type="file" id="udiPhoto" accept="image/*" capture="environment" class="d-none">

                <div class="form-check mt-3 p-2 rounded" style="background:var(--primary-light);">
                    <input class="form-check-input ms-0 me-2" type="checkbox" id="serialToggle">
                    <label class="form-check-label small" for="serialToggle"><b>按序列号管理</b></label>
                </div>

                <div id="udiResult" class="mt-3"></div>

                <div class="border-top mt-3 pt-3">
                    <div class="d-flex align-items-center mb-2">
                        <h6 class="mb-0"><i class="bi bi-list-check text-primary"></i> 待入库清单
                            <span class="badge bg-primary" id="pendingCount">0</span>
                        </h6>
                        <button type="button" class="btn btn-link btn-sm ms-auto text-muted p-0 px-1 d-none"
                                id="pendingClear">清空</button>
                    </div>
                    <div id="pendingEmpty" class="small text-muted">扫一码加一条，核对后一起提交。</div>
                    <div id="pendingList" class="d-flex flex-column gap-2"></div>
                    <div id="pendingError" class="mt-2"></div>
                    <button type="button" class="btn btn-success w-100 mt-2 d-none" id="pendingSubmit">
                        <i class="bi bi-check2-all"></i> 一次提交全部入库
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 右：入库表单（两列紧凑排布，提交按钮不用滚动也能看到） -->
    <div class="col-lg-8 mb-3">
        <div class="card">
            <div class="card-header"><h5><i class="bi bi-box-arrow-in-down"></i> 填写入库信息</h5>
                <button class="btn btn-primary btn-sm js-submit ms-auto me-2" type="submit" form="inForm">
                    <i class="bi bi-check-lg"></i> 提交入库
                </button>
                <a class="btn btn-light btn-sm" href="{{ url_for('stock_in.in_list') }}">返回列表</a>
            </div>
            <div class="card-body">
                <form method="post" id="inForm">
                    <input type="hidden" name="udi_di" id="udiDi" value="">
                    <div class="row g-3">
                        <div class="col-12 d-none" id="dupWarn"></div>

                        <div class="col-12 col-md-6">
                            <label class="form-label">试剂分类</label>
                            <select class="form-select" id="categoryFilter">
                                <option value="">全部分类</option>
                                {% for c in categories %}
                                <option value="{{ c.id }}">{{ c.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">生产企业</label>
                            <select class="form-select" id="mfrFilter">
                                <option value="">全部厂家</option>
                                {% for m in manufacturers %}
                                <option value="{{ m }}">{{ m }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label required">选择试剂</label>
                            <select class="form-select" name="reagent_id" id="reagent" required>
                                <option value="">请先选择试剂</option>
                                {% for r in reagents %}
                                <option value="{{ r.id }}" data-category="{{ r.category_id or '' }}"
                                    data-mfr="{{ r.registrant or '' }}"
                                    data-packsize="{{ r.pack_size or 1 }}" data-unit="{{ r.unit }}" data-smallunit="{{ r.small_unit }}">
                                    {{ r.name }}{% if r.registrant %}（{{ r.registrant }}）{% endif %}（{{ r.spec or '无规格' }}，1{{ r.unit }}={{ r.pack_size or 1 }}{{ r.small_unit }}）
                                </option>
                                {% endfor %}
                            </select>
                            <div class="form-text" id="packTip">请选择试剂</div>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label required">产品批号</label>
                            <input class="form-control" name="batch_no" id="batchNo" required placeholder="如 W041606007">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label required">有效期</label>
                            <input type="date" class="form-control" name="expire_date" id="expireDate" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label">序列号</label>
                            <input class="form-control" name="serial_no" id="serialNo" placeholder="可空">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">生产日期</label>
                            <input type="date" class="form-control" name="produce_date" id="produceDate">
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label required">入库数量</label>
                            <div class="input-group">
                                <input type="number" class="form-control" name="quantity" id="quantity"
                                       min="1" value="1" required>
                                <span class="input-group-text" id="unitSuffix">盒</span>
                            </div>
                            <div class="form-text" id="barcodeHint"></div>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label" id="priceLabel">每盒单价（元）</label>
                            <input type="number" step="0.01" min="0" class="form-control" name="unit_price" value="0">
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label">供应商</label>
                            <select class="form-select" name="supplier_id">
                                <option value="">请选择</option>
                                {% for s in suppliers %}
                                <option value="{{ s.id }}">{{ s.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">存放位置</label>
                            <select class="form-select" name="storage_location">
                                <option value="">请选择</option>
                                {% for l in locations %}
                                <option value="{{ l.name }}">{{ l.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label required">验收人</label>
                            <select class="form-select" name="verifier_id" required>
                                <option value="">请选择验收人</option>
                                {% for v in verifiers %}
                                <option value="{{ v.id }}">{{ v.real_name }}（{{ v.role_name }}）</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">接收状态</label>
                            <select class="form-select" name="accept_status">
                                <option value="合格">合格</option>
                                <option value="破损">破损</option>
                                <option value="拒收">拒收</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">备注</label>
                            <input class="form-control" name="remark" placeholder="可空">
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="udiCamModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title"><i class="bi bi-camera"></i> 摄像头扫描试剂盒 DM 码</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <video id="udiVideo" playsinline style="width:100%; border-radius:8px; background:#000;"></video>
                <div class="form-text mt-2">对准试剂盒上的方块码，识别成功自动关闭。</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='vendor/js/zxing.min.js') }}?v={{ STATIC_VERSION }}"></script>
<script>
    const reagentSel = document.getElementById('reagent');
    const categorySel = document.getElementById('categoryFilter');
    const mfrSel = document.getElementById('mfrFilter');
    const quantityInput = document.getElementById('quantity');

    function applyFilter() {
        const cat = categorySel.value;
        const mfr = mfrSel.value;
        // 只有选了厂家时，才反向过滤分类下拉
        if (mfr) {
            var validCats = new Set();
            Array.from(reagentSel.options).forEach(opt => {
                if (!opt.value) return;
                if (opt.dataset.mfr === mfr && opt.dataset.category) {
                    validCats.add(opt.dataset.category);
                }
            });
            Array.from(categorySel.options).forEach(opt => {
                if (!opt.value) return;
                opt.hidden = !validCats.has(opt.value);
            });
            if (categorySel.value && !validCats.has(categorySel.value)) categorySel.value = '';
        } else {
            // 没选厂家，分类全部显示
            Array.from(categorySel.options).forEach(opt => { opt.hidden = false; });
        }
        // 只有选了分类时，才反向过滤厂家下拉
        if (cat) {
            var validMfrs = new Set();
            Array.from(reagentSel.options).forEach(opt => {
                if (!opt.value) return;
                if (opt.dataset.category === cat && opt.dataset.mfr) {
                    validMfrs.add(opt.dataset.mfr);
                }
            });
            Array.from(mfrSel.options).forEach(opt => {
                if (!opt.value) return;
                opt.hidden = !validMfrs.has(opt.value);
            });
            if (mfrSel.value && !validMfrs.has(mfrSel.value)) mfrSel.value = '';
        } else {
            Array.from(mfrSel.options).forEach(opt => { opt.hidden = false; });
        }

        // 过滤试剂下拉
        var fCat = categorySel.value;
        var fMfr = mfrSel.value;
        Array.from(reagentSel.options).forEach(opt => {
            if (!opt.value) return;
            const catOk = !fCat || opt.dataset.category === fCat;
            const mfrOk = !fMfr || opt.dataset.mfr === fMfr;
            opt.hidden = !(catOk && mfrOk);
        });
        reagentSel.value = '';
        updateTip();
    }
    categorySel.addEventListener('change', applyFilter);
    mfrSel.addEventListener('change', applyFilter);

    function updateTip() {
        const opt = reagentSel.options[reagentSel.selectedIndex];
        const tip = document.getElementById('packTip');
        const hint = document.getElementById('barcodeHint');
        const unitSuffix = document.getElementById('unitSuffix');
        const priceLabel = document.getElementById('priceLabel');
        if (opt && opt.value) {
            const ps = opt.dataset.packsize;
            const u = opt.dataset.unit || '盒';
            const su = opt.dataset.smallunit || '瓶';
            tip.innerHTML = '<i class="bi bi-box-seam"></i> 该试剂每<b>' + u + '</b>含 <b>' + ps + '</b> ' + su;
            unitSuffix.textContent = u;
            priceLabel.textContent = '每' + u + '单价（元）';
            updateHint();
        } else {
            tip.innerHTML = '<i class="bi bi-info-circle"></i> 请选择试剂';
            unitSuffix.textContent = '盒';
            priceLabel.textContent = '每盒单价（元）';
            hint.textContent = '';
        }
    }
    function updateHint() {
        const q = parseInt(quantityInput.value) || 0;
        const hint = document.getElementById('barcodeHint');
        hint.innerHTML = q > 0 ? '条码 <b class="text-primary">' + q + '</b> 枚' : '';
    }
    reagentSel.addEventListener('change', updateTip);
    quantityInput.addEventListener('input', updateHint);

    // ===== UDI 扫码：扫码枪（键盘输入）+ 摄像头解码 =====
    const udiInput = document.getElementById('udiInput');
    const udiResult = document.getElementById('udiResult');
    const udiDi = document.getElementById('udiDi');
    const batchInput = document.getElementById('batchNo');
    const expireInput = document.getElementById('expireDate');
    const serialInput = document.getElementById('serialNo');
    const produceInput = document.getElementById('produceDate');
    const serialToggle = document.getElementById('serialToggle');
    const submitBtns = document.querySelectorAll('.js-submit');
    const dupWarn = document.getElementById('dupWarn');

    // 默认不识别序列号：按批号整批入库时，序列号留着反而每次都要手动删
    function wantSerial() { return !!(serialToggle && serialToggle.checked); }

    // 序列号重复时锁住提交按钮，逼着用户看清提示（后端也会再拦一次）
    let dupLocked = false;
    function setSubmitLock(lock) {
        dupLocked = !!lock;
        submitBtns.forEach(function (b) { b.disabled = dupLocked; });
    }
    function showDupWarn(info) {
        dupWarn.classList.remove('d-none');
        dupWarn.innerHTML = '<div class="alert alert-danger py-2 px-3 mb-0 small">' +
            '<i class="bi bi-x-circle"></i> <b>这一盒已入库</b>：单 <b>' + udiEscape(info.order_no) + '</b>' +
            (info.reagent ? '（' + udiEscape(info.reagent) : '') +
            (info.batch_no ? '，批号 ' + udiEscape(info.batch_no) : '') +
            (info.reagent ? '）' : '') +
            (info.create_time ? '，' + udiEscape(info.create_time) : '') +
            (info.sid ? ' <a class="ms-1" href="/stock-in/' + info.sid + '" target="_blank">查看原单</a>' : '') +
            '</div>';
        setSubmitLock(true);
    }
    function clearDupWarn() {
        dupWarn.classList.add('d-none');
        dupWarn.innerHTML = '';
        setSubmitLock(false);
    }

    if (serialToggle) {
        serialToggle.addEventListener('change', function () {
            if (!wantSerial()) {
                serialInput.value = '';   // 取消勾选：清空序列号，恢复按批入库
                clearDupWarn();
            }
        });
    }
    // 手动把序列号删空 = 这一盒不按序列号登记，解除重复锁定
    serialInput.addEventListener('input', function () {
        if (!serialInput.value.trim()) { clearDupWarn(); }
    });

    // 回车提交也要拦住（禁用按钮不一定挡得住表单键盘提交）
    document.getElementById('inForm').addEventListener('submit', function (e) {
        if (dupLocked) {
            e.preventDefault();
            dupWarn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }
    });

    // ===== 待入库清单：多种试剂先扫码攒起来，核对后一次提交 =====
    const pendingList = document.getElementById('pendingList');
    const pendingEmpty = document.getElementById('pendingEmpty');
    const pendingCount = document.getElementById('pendingCount');
    const pendingSubmit = document.getElementById('pendingSubmit');
    const pendingClear = document.getElementById('pendingClear');
    const pendingError = document.getElementById('pendingError');
    const CSRF_TOKEN = (document.querySelector('meta[name="csrf-token"]') || {}).content || '';
    let pending = [];

    function pendingKey(it) {
        return [it.reagent_id, it.batch_no, it.expire_date, it.serial_no || ''].join('|');
    }
    function renderPending() {
        const n = pending.length;
        pendingCount.textContent = n;
        pendingEmpty.classList.toggle('d-none', n > 0);
        pendingSubmit.classList.toggle('d-none', n === 0);
        pendingClear.classList.toggle('d-none', n === 0);
        pendingSubmit.disabled = false;
        pendingSubmit.innerHTML = '<i class="bi bi-check2-all"></i> 一次提交 ' + n + ' 条入库';
        pendingList.innerHTML = pending.map(function (it, i) {
            const showSerial = wantSerial();
            const lockQty = !!it.serial_no;    // 有序列号 = 单盒，数量固定 1，不能改成 2 盒
            return '<div class="border rounded px-2 py-1" data-i="' + i + '">' +
                '<div class="d-flex align-items-start gap-1">' +
                '<div class="small" style="min-width:0;">' +
                '<b>' + udiEscape(it.name) + '</b>' +
                '<div class="text-muted">批号 ' + udiEscape(it.batch_no) + ' ｜ 效期 ' + udiEscape(it.expire_date) +
                (showSerial ? ' ｜ 序列号 ' + (it.serial_no ? udiEscape(it.serial_no) : '—') : '') + '</div>' +
                '</div>' +
                '<button type="button" class="btn btn-link btn-sm text-danger ms-auto p-0 px-1 js-del" title="删掉这条">&times;</button>' +
                '</div>' +
                '<div class="d-flex align-items-center gap-1 mt-1">' +
                '<span class="small text-muted">数量</span>' +
                '<input type="number" min="1" class="form-control form-control-sm js-qty" style="width:78px" value="' +
                (lockQty ? 1 : it.quantity) + '"' +
                (lockQty ? ' disabled title="有序列号按单盒入库，数量固定 1"' : '') + '>' +
                '<span class="small text-muted">' +
                (lockQty ? '盒（序列号唯一）' : udiEscape(it.unit || '盒')) + '</span>' +
                '</div></div>';
        }).join('');
    }
    function addPending(it) {
        const key = pendingKey(it);
        const exist = pending.find(function (x) { return pendingKey(x) === key; });
        if (exist) {
            if (it.serial_no) {
                // 有序列号 = 具体某一盒，序列号唯一：重复扫同一盒不能再累加数量，
                // 否则同一个序列号会变成 2 盒、生成 2 个同号盒条码
                renderPending();
                return false;
            }
            exist.quantity += 1;                   // 无序列号（按批号整批入库）→ 合并，数量+1
        } else {
            pending.push(it);
        }
        renderPending();
        pendingSubmit.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        return true;
    }

    pendingList.addEventListener('click', function (e) {
        if (!e.target.closest('.js-del')) return;
        const i = parseInt(e.target.closest('[data-i]').dataset.i, 10);
        pending.splice(i, 1);
        renderPending();
    });
    pendingList.addEventListener('change', function (e) {
        const inp = e.target.closest('.js-qty');
        if (!inp) return;
        const i = parseInt(inp.closest('[data-i]').dataset.i, 10);
        let v = parseInt(inp.value, 10);
        if (!v || v < 1) { v = 1; }
        pending[i].quantity = v;
        inp.value = v;
    });
    pendingClear.addEventListener('click', function () {
        pending = [];
        pendingError.innerHTML = '';
        renderPending();
    });

    pendingSubmit.addEventListener('click', function () {
        if (!pending.length) return;
        const verifierSel = document.querySelector('[name="verifier_id"]');
        if (!verifierSel.value) {
            pendingError.innerHTML = '<div class="alert alert-warning py-1 px-2 mb-0 small">' +
                '<i class="bi bi-exclamation-triangle"></i> 先在右侧选验收人</div>';
            verifierSel.scrollIntoView({ behavior: 'smooth', block: 'center' });
            verifierSel.focus();
            return;
        }
        const payload = {
            items: pending.map(function (it) {
                return {
                    reagent_id: it.reagent_id, batch_no: it.batch_no, serial_no: it.serial_no,
                    produce_date: it.produce_date, expire_date: it.expire_date,
                    quantity: it.quantity, unit_price: it.unit_price, udi_di: it.udi_di,
                };
            }),
            verifier_id: verifierSel.value,
            supplier_id: document.querySelector('[name="supplier_id"]').value,
            storage_location: document.querySelector('[name="storage_location"]').value,
            accept_status: document.querySelector('[name="accept_status"]').value,
            remark: document.querySelector('[name="remark"]').value,
        };
        pendingError.innerHTML = '';
        pendingSubmit.disabled = true;
        pendingSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>提交中…';
        fetch('/stock-in/add-batch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF_TOKEN },
            body: JSON.stringify(payload),
        }).then(function (r) { return r.json(); })
          .then(function (d) {
              if (d && d.ok) {
                  if (d.labels_url) { window.location.href = d.labels_url; return; }
                  window.location.href = '{{ url_for("stock_in.in_list") }}';
                  return;
              }
              const errs = (d && d.errors) || ['提交失败'];
              pendingError.innerHTML = '<div class="alert alert-danger py-2 px-2 mb-0 small">' +
                  errs.map(function (x) { return '· ' + udiEscape(x); }).join('<br>') + '</div>';
              renderPending();
          })
          .catch(function () {
              pendingError.innerHTML = '<div class="alert alert-danger py-1 px-2 mb-0 small">' +
                  '提交失败，请检查服务</div>';
              renderPending();
          });
    });

    function udiEscape(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function showUdi(html, level) {
        udiResult.innerHTML = '<div class="alert alert-' + level +
            ' py-2 px-3 mb-0 small">' + html + '</div>';
    }
    const REAGENT_NEW_URL = '{{ url_for("basic.reagent_list") }}';
    const CAN_CREATE_REAGENT = {{ 'true' if can_create_reagent else 'false' }};
    // 扫码信息（名称/规格/注册证/厂家）带到试剂档案新增弹窗，保存后自动回到本页并重新识别。
    // 注意：不要把带多个参数的 URL 直接拼进 href —— innerHTML 解析时 "&reg_no=" 的 "&reg"
    // 会被当成 HTML 实体 ®，分隔符被吃掉，reg_no 会并进 spec。这里只放 data-*，点击时用
    // URL 对象拼参数，绕开实体解析。
    function udiCreateLink(prod, code) {
        if (!CAN_CREATE_REAGENT) {
            return '<div class="mt-1 small">无建档权限，请联系组长建档</div>';
        }
        const p = prod || {};
        function attr(name, val) {
            return val ? ' ' + name + '="' + udiEscape(val) + '"' : '';
        }
        return '<button type="button" class="btn btn-sm btn-success ms-0 mt-2 w-100 udi-new-reagent"' +
            attr('data-name', p.name) + attr('data-spec', p.spec) + attr('data-reg', p.reg_no) +
            attr('data-mfr', p.mfr) + attr('data-di', p.di) + attr('data-code', code) +
            '>＋ 新建试剂档案</button>';
    }
    function selectReagentById(id) {
        categorySel.value = '';
        mfrSel.value = '';
        Array.from(categorySel.options).forEach(o => { o.hidden = false; });
        Array.from(mfrSel.options).forEach(o => { o.hidden = false; });
        Array.from(reagentSel.options).forEach(o => { o.hidden = false; });
        reagentSel.value = String(id);
        updateTip();
    }
    function handleUdi(code) {
        if (!code) { return; }
        // 清空并聚焦扫码框：连续扫多个盒码时，下一枪的字符不会接在上一串后面
        udiInput.value = '';
        udiInput.focus();
        fetch('/stock-in/udi?code=' + encodeURIComponent(code))
            .then(function (r) { return r.json(); })
            .then(function (d) {
                const p = d.parsed || {};
                udiDi.value = p.di || '';
                const parts = [];
                if (p.batch_no) { batchInput.value = p.batch_no; parts.push('批号 <b>' + udiEscape(p.batch_no) + '</b>'); }
                if (p.serial && wantSerial()) {
                    serialInput.value = p.serial;
                    parts.push('序列号 <b>' + udiEscape(p.serial) + '</b>');
                    // 这一盒已经入过库：告警 + 锁住提交按钮（后端保存时还会再拦一次）
                    if (d.serial_dup) { showDupWarn(d.serial_dup); } else { clearDupWarn(); }
                } else {
                    // 未勾选识别序列号（按批入库），或码里没有 21：不登记序列号
                    serialInput.value = '';
                    clearDupWarn();
                    if (wantSerial() && !p.serial) {
                        // 勾了但码里确实没有 21：标明“—”，仍按批号正常入库，不当作识别失败
                        parts.push('序列号 <b>—</b>');
                    }
                }
                if (p.produce_date) { produceInput.value = p.produce_date; parts.push('生产日期 <b>' + udiEscape(p.produce_date) + '</b>'); }
                if (p.expire_date) { expireInput.value = p.expire_date; parts.push('有效期 <b>' + udiEscape(p.expire_date) + '</b>'); }
                const codeInfo = parts.length ? '<div class="mt-1">' + parts.join(' ｜ ') + '</div>' : '';

                if (!p.di && !parts.length) {
                    showUdi('没识别出 GS1 码，扫到的内容：<b>' +
                        udiEscape(String(code).slice(0, 120)) + '</b>（' + String(code).length + ' 字符）', 'warning');
                    return;
                }
                const prod = d.product;
                let prodInfo = '';
                if (prod) {
                    prodInfo = '<div class="mt-1"><b>' + udiEscape(prod.name) + '</b>' +
                        (prod.spec ? '，' + udiEscape(prod.spec) : '') +
                        (prod.mfr ? '<br>' + udiEscape(prod.mfr) : '') +
                        (prod.reg_no ? ' ｜ 证 ' + udiEscape(prod.reg_no) : '') + '</div>';
                }
                if (d.reagent_id) {
                    selectReagentById(d.reagent_id);
                    const opt = reagentSel.options[reagentSel.selectedIndex];
                    const isDup = !!(p.serial && wantSerial() && d.serial_dup);
                    let pendMsg = isDup ? '（已入库，未加入清单）' : '，已加入清单';
                    if (!isDup) {
                        // 扫码成功就攒进待入库清单：无序列号的按批号合并数量 +1；
                        // 有序列号的是具体一盒，序列号唯一，重复扫不再累加
                        const added = addPending({
                            reagent_id: d.reagent_id,
                            name: opt ? opt.text.trim().split('（')[0] : '已选试剂',
                            unit: opt ? (opt.dataset.unit || '盒') : '盒',
                            batch_no: (p.batch_no || batchInput.value || '').trim(),
                            serial_no: (p.serial && wantSerial()) ? p.serial : '',
                            produce_date: p.produce_date || '',
                            expire_date: p.expire_date || expireInput.value || '',
                            quantity: 1,
                            unit_price: parseFloat(document.querySelector('[name="unit_price"]').value) || 0,
                            udi_di: p.di || '',
                        });
                        if (!added) {
                            pendMsg = '，已在清单中';
                        }
                    }
                    showUdi('<i class="bi bi-check-circle text-success"></i> <b>' +
                        udiEscape(opt ? opt.text.trim() : '') + '</b>' +
                        pendMsg +
                        codeInfo + prodInfo, isDup ? 'warning' : 'success');
                    return;
                }
                let cand = '';
                if (d.candidates && d.candidates.length) {
                    cand = '<div class="mt-2">可能对应：' +
                        d.candidates.map(function (c) {
                            return '<button type="button" class="btn btn-sm btn-outline-primary me-1 mb-1 udi-cand" data-id="' +
                                c.id + '">' + udiEscape(c.name) +
                                (c.reason ? '（' + udiEscape(c.reason) + '）' : '') + '</button>';
                        }).join('') + '</div>';
                }
                const headLine = '<i class="bi bi-check-circle text-success"></i> <b>已识别</b>，右侧已填入';
                const lead = prod
                    ? headLine + '。档案里没有这条试剂：选下方已有试剂，或直接建档'
                    : headLine + '；UDI 库里没有这个产品：选已有试剂或建档';
                showUdi(lead + codeInfo + prodInfo + cand + udiCreateLink(prod, code), 'warning');
            })
            .catch(function () { showUdi('识别失败，请检查服务', 'danger'); });
    }
    udiInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const code = udiInput.value.trim();
            if (code) { handleUdi(code); }
        }
    });
    udiResult.addEventListener('click', function (e) {
        const newBtn = e.target.closest('.udi-new-reagent');
        if (newBtn) {
            const u = new URL(REAGENT_NEW_URL, window.location.origin);
            u.searchParams.set('new', '1');
            [['data-name', 'name'], ['data-spec', 'spec'], ['data-reg', 'reg_no'],
             ['data-mfr', 'registrant'], ['data-di', 'udi_di'], ['data-code', 'udi']]
                .forEach(function (pair) {
                    const v = newBtn.getAttribute(pair[0]);
                    if (v) { u.searchParams.set(pair[1], v); }
                });
            window.location.href = u.toString();
            return;
        }
        const btn = e.target.closest('.udi-cand');
        if (!btn) { return; }
        selectReagentById(btn.dataset.id);
        showUdi('<i class="bi bi-check-circle text-success"></i> 已选：<b>' +
            udiEscape(btn.textContent) + '</b>，提交后自动记住这个 DI', 'success');
    });

    // 拍照识别：手机 / 局域网（http 非安全上下文）也能用，上传照片不要求 HTTPS
    const udiPhotoInput = document.getElementById('udiPhoto');
    document.getElementById('udiPhotoBtn').addEventListener('click', function () {
        if (typeof ZXing === 'undefined') {
            alert('解码库未加载，请刷新页面重试');
            return;
        }
        udiPhotoInput.value = '';
        udiPhotoInput.click();
    });
    udiPhotoInput.addEventListener('change', function () {
        const file = udiPhotoInput.files && udiPhotoInput.files[0];
        if (!file) { return; }
        const fail = '没识别到码，请靠近、放正、避免反光再拍';
        showUdi('正在识别…', 'info');
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
                  [ZXing.BarcodeFormat.DATA_MATRIX, ZXing.BarcodeFormat.QR_CODE]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        const reader = new ZXing.BrowserMultiFormatReader(hints, 500);
        const objUrl = URL.createObjectURL(file);
        const img = new Image();
        img.onload = function () {
            // 手机原图可能 4000px 以上，先缩到长边 1600 再解码：快得多，成功率也够
            const maxSide = 1600;
            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const cv = document.createElement('canvas');
            cv.width = Math.round(img.width * scale);
            cv.height = Math.round(img.height * scale);
            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
            reader.decodeFromImageUrl(cv.toDataURL('image/jpeg', 0.92)).then(function (res) {
                URL.revokeObjectURL(objUrl);
                if (res && res.getText()) { handleUdi(res.getText()); }
                else { showUdi(fail, 'warning'); }
            }).catch(function () {
                URL.revokeObjectURL(objUrl);
                showUdi(fail, 'warning');
            });
        };
        img.onerror = function () {
            URL.revokeObjectURL(objUrl);
            showUdi('图片打不开，请重拍', 'danger');
        };
        img.src = objUrl;
    });

    let udiReader = null;
    function stopUdiCam() {
        if (udiReader) { try { udiReader.reset(); } catch (e) {} udiReader = null; }
    }
    document.getElementById('udiCamBtn').addEventListener('click', function () {
        if (!window.isSecureContext) {
            alert('局域网 http 下浏览器禁用摄像头，请用扫码枪或拍照识别');
            return;
        }
        if (typeof ZXing === 'undefined') {
            alert('解码库未加载，请刷新页面重试');
            return;
        }
        const camModal = new bootstrap.Modal(document.getElementById('udiCamModal'));
        camModal.show();
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
                  [ZXing.BarcodeFormat.DATA_MATRIX, ZXing.BarcodeFormat.QR_CODE]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        udiReader = new ZXing.BrowserMultiFormatReader(hints, 300);
        udiReader.decodeFromVideoDevice(null, 'udiVideo', function (res) {
            if (res) {
                const text = res.getText();
                stopUdiCam();
                camModal.hide();
                handleUdi(text);
            }
        }).catch(function (err) {
            stopUdiCam();
            camModal.hide();
            alert('打不开摄像头：' + (err && err.message ? err.message : err) +
                  '\n请检查摄像头连接和浏览器的摄像头权限');
        });
    });
    document.getElementById('udiCamModal').addEventListener('hidden.bs.modal', stopUdiCam);

    // 从试剂档案「新建」返回时带回来的码：自动重新识别一次，省得再扫
    const UDI_AUTO = {{ (udi_code or '')|tojson }};
    if (UDI_AUTO) {
        handleUdi(UDI_AUTO);
    }
</script>
{% endblock %}
