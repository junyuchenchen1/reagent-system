{% extends 'base.html' %}
{% block title %}编辑入库记录{% endblock %}
{% block page_title %}编辑入库记录{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">试剂</label>
                <input class="form-control" value="{{ si.reagent.name }}" disabled>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">批号</label>
                    <input class="form-control" name="batch_no" value="{{ si.batch_no }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">有效期</label>
                    <input type="date" class="form-control" name="expire_date" value="{{ si.expire_date.strftime('%Y-%m-%d') }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">数量({{ si.reagent.unit }})</label>
                    <input type="number" class="form-control" name="quantity" value="{{ si.quantity }}" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">单价(元)</label>
                    <input type="number" step="0.01" class="form-control" name="unit_price" value="{{ si.unit_price }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">供应商</label>
                    <select class="form-select" name="supplier_id">
                        <option value="">请选择</option>
                        {% for s in suppliers %}<option value="{{ s.id }}" {{ 'selected' if si.supplier_id==s.id }}>{{ s.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">存放位置</label>
                    <input class="form-control" name="storage_location" value="{{ si.storage_location or '' }}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">备注</label>
                <textarea class="form-control" name="remark" rows="2">{{ si.remark or '' }}</textarea>
            </div>
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> 保存</button>
            <a class="btn btn-light" href="{{ url_for('stock_in.in_list') }}">返回</a>
        </form>
    </div>
</div>
{% endblock %}
