{% extends 'base.html' %}
{% block title %}修改密码{% endblock %}
{% block page_title %}修改密码{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header"><h5><i class="bi bi-key me-2"></i>修改登录密码</h5></div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label required">原密码</label>
                        <input type="password" name="old_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label required">新密码</label>
                        <input type="password" name="new_password" class="form-control" required minlength="6">
                        <div class="form-text">新密码长度不少于 6 位</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label required">确认新密码</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 确认修改</button>
                        <a href="{{ url_for('dashboard.index') }}" class="btn btn-light">返回</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
