<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}{% endblock %}{% if self.title() %} - {% endif %}{{ APP_NAME }}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="{{ url_for('static', filename='vendor/css/bootstrap.min.css') }}?v={{ STATIC_VERSION }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/css/bootstrap-icons.min.css') }}?v={{ STATIC_VERSION }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}?v={{ STATIC_VERSION }}" rel="stylesheet">
    <style>
        .flash-toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999; min-width: 320px; max-width: 500px;
        }
        .flash-toast-container .alert { margin-bottom: 8px; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
{% block full %}
<div class="wrapper">
    {% include 'sidebar.html' %}
    <div class="main-wrapper">
        {% include 'header.html' %}
        <div class="page-content">
            {% include 'flash.html' %}
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
{% include 'confirm_modal.html' %}
{% endblock %}

<script src="{{ url_for('static', filename='vendor/js/bootstrap.bundle.min.js') }}?v={{ STATIC_VERSION }}"></script>
<script src="{{ url_for('static', filename='vendor/js/JsBarcode.all.min.js') }}?v={{ STATIC_VERSION }}"></script>
<script src="{{ url_for('static', filename='js/main.js') }}?v={{ STATIC_VERSION }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
